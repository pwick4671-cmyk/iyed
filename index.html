<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d10">
  <title>Nova AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo">✦</span>
        <span>Nova</span>
      </div>

      <button class="new-chat" id="newChat">
        ＋ محادثة جديدة
      </button>

      <div class="search">
        🔍
        <input id="searchInput" placeholder="بحث في المحادثات">
      </div>

      <div class="history" id="history"></div>

      <div class="side-bottom">
        <button class="side-btn" id="themeBtn">🌙 الوضع الليلي</button>
        <button class="side-btn" id="settingsBtn">⚙️ الإعدادات</button>
      </div>
    </aside>

    <main class="main">

      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn">☰</button>
        <strong>Nova</strong>
        <button class="icon-btn" id="clearBtn">🗑️</button>
      </header>

      <section class="chat" id="chat">

        <div class="welcome" id="welcome">
          <div class="hero-logo">✦</div>

          <h1>كيفاش نعاونك اليوم؟</h1>

          <p>
            اكتب سؤالك أو استعمل الميكروفون للتحدث مع Nova.
          </p>

          <div class="suggestions">
            <button data-prompt="اعطيني فكرة Web App جديدة">
              💡 فكرة مشروع
            </button>

            <button data-prompt="ساعدني نكتب خطة لمشروع">
              📝 خطة مشروع
            </button>

            <button data-prompt="فسرلي كيفاش يخدم الذكاء الاصطناعي">
              🤖 شرح AI
            </button>

            <button data-prompt="اكتبلي مثال HTML بسيط">
              💻 كود
            </button>
          </div>
        </div>

      </section>

      <div class="composer-wrap">

        <div id="filePreview" class="file-preview"></div>

        <div class="composer">

          <label class="attach">
            📎
            <input type="file" id="fileInput" hidden>
          </label>

          <textarea
            id="messageInput"
            rows="1"
            placeholder="اكتب رسالتك إلى Nova..."
          ></textarea>

          <button class="voice" id="voiceBtn">
            🎙️
          </button>

          <button class="send" id="sendBtn">
            ➤
          </button>

        </div>

        <div class="hint">
          Nova Frontend Demo
        </div>

      </div>

    </main>
  </div>

  <div class="modal hidden" id="settingsModal">

    <div class="modal-card">

      <button class="close" id="closeSettings">
        ×
      </button>

      <h2>الإعدادات</h2>

      <label class="setting-row">
        اسم المساعد
        <input id="assistantName" value="Nova">
      </label>

      <label class="setting-row">
        حفظ المحادثات
        <input type="checkbox" id="saveChats" checked>
      </label>

      <button class="primary" id="saveSettings">
        حفظ
      </button>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
