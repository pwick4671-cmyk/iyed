<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThailandCodes Translation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[#0a0a0c] text-slate-200 font-sans antialiased overflow-hidden">

    <div class="flex h-screen">
        <aside class="w-80 bg-[#0f0f12] border-l border-purple-900/30 flex flex-col shadow-2xl z-10">
            <div class="p-6 border-b border-purple-900/20 flex items-center gap-3">
                <i data-lucide="history" class="text-purple-500"></i>
                <h2
                    class="text-xl font-bold bg-gradient-to-l from-purple-400 to-fuchsia-500 bg-clip-text text-transparent">
                    سجل الترجمة</h2>
            </div>
            <div id="historyList" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar"></div>
        </aside>

        <main class="flex-1 flex flex-col relative overflow-hidden">
            <div
                class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(circle_at_20%_30%,#3b0764_0%,transparent_50%)] opacity-20">
            </div>

            <div class="flex-1 flex flex-col items-center justify-center p-8 relative">
                <header class="text-center mb-10">
                    <div class="inline-block p-3 rounded-2xl bg-purple-500/10 mb-4 border border-purple-500/20">
                        <i data-lucide="languages" class="w-8 h-8 text-purple-500"></i>
                    </div>
                    <h1 class="text-4xl font-black tracking-tight mb-2 uppercase">مترجم تايلاند كودز</h1>
                    <div class="h-1 w-20 bg-purple-600 mx-auto rounded-full"></div>
                </header>

                <div id="mainCard"
                    class="w-full max-w-5xl bg-[#121217]/80 backdrop-blur-xl rounded-[2rem] shadow-2xl border border-purple-500/10 p-8">
                    <div class="flex items-center justify-between gap-4 mb-8">
                        <div class="flex-1 flex items-center gap-2 bg-[#1a1a22] p-2 rounded-xl border border-white/5">
                            <i data-lucide="info" class="w-4 h-4 text-purple-400"></i>
                            <select id="sourceLang"
                                class="bg-transparent w-full p-2 outline-none text-sm cursor-pointer">
                                <option value="auto">لايوجد لغة (قم بإختيار لغة)</option>
                            </select>
                        </div>

                        <button id="swapBtn"
                            class="group p-4 rounded-full bg-purple-600 hover:bg-purple-500 transition-all shadow-[0_0_20px_rgba(147,51,234,0.3)]">
                            <i data-lucide="arrow-left-right"
                                class="w-5 h-5 text-white group-hover:scale-110 transition-transform"></i>
                        </button>

                        <div class="flex-1 flex items-center gap-2 bg-[#1a1a22] p-2 rounded-xl border border-white/5">
                            <i data-lucide="globe" class="w-4 h-4 text-purple-400"></i>
                            <select id="targetLang"
                                class="bg-transparent w-full p-2 outline-none text-sm cursor-pointer"></select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        <textarea id="inputText" placeholder="ابدأ الكتابة هنا..."
                            class="w-full h-64 p-6 rounded-2xl bg-[#0a0a0c] border border-white/5 focus:border-purple-500/50 focus:ring-1 focus:ring-purple-500/50 outline-none transition-all text-xl placeholder-slate-600"></textarea>
                        <textarea id="outputText" placeholder="الترجمة الآلية..." readonly
                            class="w-full h-64 p-6 rounded-2xl bg-[#1a1a22] border border-purple-500/5 text-purple-300 text-xl resize-none"></textarea>
                    </div>

                    <button id="translateBtn"
                        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-5 rounded-2xl transition-all shadow-lg hover:shadow-purple-500/20 active:scale-[0.98] flex items-center justify-center gap-3">
                        <span>ترجمة النص الآن</span>
                        <i data-lucide="zap" class="w-5 h-5 fill-current"></i>
                    </button>
                </div>
            </div>

            <div id="aiStatus"
                class="fixed bottom-20 left-8 flex items-center gap-3 bg-[#121217]/90 backdrop-blur-md p-3 px-5 rounded-2xl border border-purple-500/20 opacity-0 transition-opacity duration-300">
                <div id="loaderCircle"
                    class="w-4 h-4 border-2 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
                <span id="statusText" class="text-xs font-bold text-purple-400 uppercase tracking-widest">جاري
                    التعرف...</span>
            </div>

            <footer
                class="w-full py-6 text-center border-t border-purple-900/20 bg-[#0a0a0c]/80 backdrop-blur-xl relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-purple-500/5 to-transparent"></div>
                <p class="relative z-10 text-slate-400 text-sm tracking-widest uppercase">
                    Powered By
                    <span
                        class="text-purple-500 font-black hover:text-purple-400 transition-all duration-300 cursor-pointer mx-1">ThailandCodes</span>
                    <span class="text-slate-600">&</span>
                    <span
                        class="text-blue-500 font-black hover:text-blue-400 transition-all duration-300 cursor-pointer mx-1">MOAAZ.DEV</span>
                </p>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
